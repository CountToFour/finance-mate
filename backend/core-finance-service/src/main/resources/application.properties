spring.application.name=core-finance-service

spring.datasource.url=jdbc:postgresql://localhost:15432/finance_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8082

exchange.api.key=${EXCHANGE_RATE_API_KEY}

spring.cache.type=caffeine
spring.cache.cache-names=exchangeRates
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=adminpassword