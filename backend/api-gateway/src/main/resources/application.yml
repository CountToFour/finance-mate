spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**, /api/user/**
            - id: core-finance-service-route
              uri: lb://core-finance-service
              predicates:
                - Path=/api/account/**, /api/transaction/**, /api/currency/**, /api/categories/**,

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/financemate-realm

  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/

server:
  port: 8080